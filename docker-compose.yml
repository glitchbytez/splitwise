# Local development stack: PostgreSQL 16 + the API.
#   docker compose up --build
# Values come from .env if present (see .env.example); the defaults below are for local use only.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-splitwise}
      POSTGRES_USER: ${POSTGRES_USER:-splitwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-splitwise}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-splitwise}
      DB_USER: ${POSTGRES_USER:-splitwise}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-splitwise}
      # Falls back to a development-only secret when JWT_SECRET is unset or empty.
      JWT_SECRET: ${JWT_SECRET:-local-development-only-jwt-secret-change-me}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
