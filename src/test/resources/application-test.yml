# Integration tests. The datasource is supplied by Testcontainers via @ServiceConnection.
logging:
  level:
    root: WARN
    com.glitchbytez.splitwise: INFO

app:
  jwt:
    secret: integration-test-jwt-secret-at-least-32-bytes
  security:
    # Minimum BCrypt cost: hashing is not what these tests verify, and strength 12 makes them several times slower.
    bcrypt-strength: 4
